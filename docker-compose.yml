version: '3'

services:
  devkitVue:
    container_name: devkitVue
    image: pierreb/vue:latest
    restart: always
    ports:
      - 8080:80
    volumes:
      - devkitVue:/data
    networks:
      - frontend
    depends_on:
      - devkitNode
    environment:
      - 'WAOS_VUE_api_host=devkitnode'

  devkitNode:
    container_name: devkitNode
    image: pierreb/node:latest
    restart: always
    ports:
      - 3000:3000
    volumes:
      - devkitNode:/data
    networks:
      - frontend
      - backend
    depends_on:
      - mongo
    environment:
      - 'WAOS_NODE_db_uri=mongodb://mongo:27017/DevkitNodeDev'
      - 'WAOS_NODE_host=0.0.0.0'

  mongo:
    container_name: mongo
    image: mongo:latest
    restart: always
    volumes:
      - mongo:/data
    networks:
      - backend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  devkitVue:
  devkitNode:
  mongo:
