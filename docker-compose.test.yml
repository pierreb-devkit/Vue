services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    tmpfs:
      - /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  node-api:
    build:
      context: ${NODE_CONTEXT:-../Node}
      dockerfile: Dockerfile
    ports:
      - "3000:3001"
    environment:
      NODE_ENV: test
      DEVKIT_NODE_db_uri: mongodb://mongo:27017/NodeTest
      DEVKIT_NODE_cors_origin: '["http://localhost:${VUE_PORT:-8080}","http://vue:8080"]'
      DEVKIT_NODE_cors_credentials: "true"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/home').then(r => { if (!r.ok) throw 1 })"]
      interval: 5s
      timeout: 5s
      retries: 10

  vue:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${VUE_PORT:-8080}:8080"
    environment:
      NODE_ENV: test
      DEVKIT_VUE_api_protocol: http
      DEVKIT_VUE_api_host: localhost
      DEVKIT_VUE_api_port: "3000"
      DEVKIT_VUE_api_base: api
    depends_on:
      node-api:
        condition: service_healthy
