<!-- Product Engineering - Web + Mobile Delivery -->
<svg viewBox="0 0 500 350" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Product Engineering Delivery">
  <defs>
    <style>
      .deviceText{ 
        font: 600 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; 
        fill: #111827;
      }
      .checklistText{ 
        font: 600 16px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; 
        fill: #111827;
      }
      .labelText{ 
        font: 500 11px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; 
        letter-spacing: .3px;
        fill: #6b7280;
      }

      /* Device and card backgrounds */
      .card-bg {
        fill: #ffffff;
        fill-opacity: 0.92;
        stroke-width: 4;
      }

      .wireframe {
        fill: #e5e7eb;
        stroke: #9ca3af;
        stroke-width: 1;
      }

      /* Dark mode */
      @media (prefers-color-scheme: dark) {
        .card-bg {
          fill: #1a1a24;
          fill-opacity: 0.95;
        }
        .deviceText, .checklistText {
          fill: #fafafa;
        }
        .labelText {
          fill: #9ca3af;
        }
        .wireframe {
          fill: #374151;
          stroke: #6b7280;
        }
      }

      /* Subtle floating animation for devices */
      .device-desktop { animation: float1 6s ease-in-out infinite; }
      .device-mobile { animation: float2 5s ease-in-out infinite; }
      
      @keyframes float1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }

      /* Progress animation for checklist */
      .reduce-motion .device-desktop,
      .reduce-motion .device-mobile { animation: none !important; }
    </style>

    <!-- Animated rotating gradients - blue for devices -->
    <linearGradient id="gradDeviceDesktop" gradientTransform="rotate(0)">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1"/>
      <stop offset="25%" style="stop-color:#60a5fa;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#1e40af;stop-opacity:1"/>
      <stop offset="75%" style="stop-color:#60a5fa;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="gradDeviceMobile" gradientTransform="rotate(45)">
      <stop offset="0%" style="stop-color:#1d4ed8;stop-opacity:1"/>
      <stop offset="25%" style="stop-color:#93c5fd;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#1d4ed8;stop-opacity:1"/>
      <stop offset="75%" style="stop-color:#93c5fd;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="45" to="405" dur="10s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Orange gradient for checklist items -->
    <linearGradient id="gradBuild" gradientTransform="rotate(90)">
      <stop offset="0%" style="stop-color:#c2410c;stop-opacity:1"/>
      <stop offset="25%" style="stop-color:#fb923c;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#c2410c;stop-opacity:1"/>
      <stop offset="75%" style="stop-color:#fb923c;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c2410c;stop-opacity:1"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="90" to="450" dur="10s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="gradTest" gradientTransform="rotate(135)">
      <stop offset="0%" style="stop-color:#ea580c;stop-opacity:1"/>
      <stop offset="25%" style="stop-color:#fdba74;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#ea580c;stop-opacity:1"/>
      <stop offset="75%" style="stop-color:#fdba74;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="135" to="495" dur="10s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="gradDeploy" gradientTransform="rotate(180)">
      <stop offset="0%" style="stop-color:#c2410c;stop-opacity:1"/>
      <stop offset="25%" style="stop-color:#fed7aa;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#c2410c;stop-opacity:1"/>
      <stop offset="75%" style="stop-color:#fed7aa;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c2410c;stop-opacity:1"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="180" to="540" dur="10s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Arrow marker -->
    <marker id="arrowProd" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f97316"/>
    </marker>
  </defs>

  <!-- Desktop Device Frame (left) -->
  <g class="device-desktop">
    <rect x="30" y="40" width="200" height="150" rx="12" class="card-bg" stroke="url(#gradDeviceDesktop)"/>
    
    <!-- Wireframe content -->
    <rect x="45" y="55" width="170" height="10" rx="2" class="wireframe"/>
    <rect x="45" y="75" width="80" height="60" rx="4" class="wireframe"/>
    <rect x="135" y="75" width="80" height="30" rx="2" class="wireframe"/>
    <rect x="135" y="115" width="80" height="20" rx="2" class="wireframe"/>
    <rect x="45" y="145" width="170" height="6" rx="1" class="wireframe"/>
    <rect x="45" y="160" width="170" height="6" rx="1" class="wireframe"/>
    <rect x="45" y="175" width="120" height="6" rx="1" class="wireframe"/>
    
    <text x="130" y="210" text-anchor="middle" class="deviceText" fill="#2563eb">Desktop</text>
  </g>

  <!-- Mobile Device Frame (right) -->
  <g class="device-mobile">
    <rect x="280" y="50" width="120" height="180" rx="16" class="card-bg" stroke="url(#gradDeviceMobile)"/>
    
    <!-- Wireframe content -->
    <rect x="290" y="60" width="100" height="8" rx="2" class="wireframe"/>
    <rect x="295" y="78" width="90" height="60" rx="4" class="wireframe"/>
    <rect x="295" y="148" width="90" height="15" rx="2" class="wireframe"/>
    <rect x="295" y="173" width="90" height="15" rx="2" class="wireframe"/>
    <rect x="295" y="198" width="90" height="15" rx="2" class="wireframe"/>
    
    <text x="340" y="250" text-anchor="middle" class="deviceText" fill="#2563eb">Mobile</text>
  </g>

  <!-- Release Checklist Flow (bottom) -->
  <!-- Build -->
  <g>
    <rect x="50" y="270" width="100" height="55" rx="12" class="card-bg" stroke="url(#gradBuild)"/>
    <text x="100" y="294" text-anchor="middle" class="checklistText" fill="#f97316">Build</text>
    <text x="100" y="312" text-anchor="middle" class="labelText">Compile, Bundle</text>
  </g>

  <!-- Arrow Build → Test -->
  <path d="M150 297 L170 297" stroke="#f97316" stroke-width="2" marker-end="url(#arrowProd)"/>

  <!-- Test -->
  <g>
    <rect x="180" y="270" width="100" height="55" rx="12" class="card-bg" stroke="url(#gradTest)"/>
    <text x="230" y="294" text-anchor="middle" class="checklistText" fill="#f97316">Test</text>
    <text x="230" y="312" text-anchor="middle" class="labelText">E2E, Unit, QA</text>
  </g>

  <!-- Arrow Test → Deploy -->
  <path d="M280 297 L300 297" stroke="#f97316" stroke-width="2" marker-end="url(#arrowProd)"/>

  <!-- Deploy -->
  <g>
    <rect x="310" y="270" width="100" height="55" rx="12" class="card-bg" stroke="url(#gradDeploy)"/>
    <text x="360" y="294" text-anchor="middle" class="checklistText" fill="#f97316">Deploy</text>
    <text x="360" y="312" text-anchor="middle" class="labelText">Ship to Prod</text>
  </g>
</svg>
