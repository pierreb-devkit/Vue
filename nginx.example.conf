server {
  listen 80;
  server_name _ default_server;

  root /usr/share/nginx/html;

  # Relative Location on every redirect nginx sends (directory slash, `return`):
  # TLS ends at the upstream proxy, so an absolute one would point at http://.
  absolute_redirect off;

  # ── Baseline security headers ──────────────────────────────────────────────
  # `always` ensures the headers are emitted on error responses (4xx/5xx) too.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # HSTS is only honored over HTTPS; harmless over plain HTTP. Terminate TLS at
  # this server (or an upstream proxy) before relying on it.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # Content-Security-Policy starter, in Report-Only so it never blocks until
  # tuned. MUST be reviewed and tightened per-app (inline styles, CDNs, API
  # origins, fonts, analytics, ...) before switching to the enforcing
  # `Content-Security-Policy` header.
  add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'" always;

  # ── Compression ────────────────────────────────────────────────────────────
  # text/html is always compressed once gzip is on; list the other text types.
  # `gzip_proxied any`: requests arrive through the TLS proxy.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/xml text/xml application/manifest+json image/svg+xml text/markdown;

  # ── Caching ────────────────────────────────────────────────────────────────
  # `expires` only: an `add_header` inside a location would drop the security
  # headers above (nginx does not merge add_header across levels).
  # Vite output under /assets/ is content-hashed: cache it for a year, and let a
  # missing chunk answer a real 404 instead of the HTML shell.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  location / {
    # HTML and other root files revalidate on each visit, so a deploy shows at once.
    expires -1;
    # $uri/index.html before $uri/: a prerendered page answers 200 at its no-slash
    # URL (the one in the sitemap and canonical), without a directory 301.
    try_files $uri $uri/index.html $uri/ /index.html;
  }
}